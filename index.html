<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Grocery - Fresh Groceries Delivered Fast</title>
    <meta name="description" content="Shop fresh groceries, daily essentials, organic farm produce, dairy, and household items with instant delivery at My Grocery." />
    <meta property="og:title" content="My Grocery - Fresh Groceries Delivered Fast" />
    <meta property="og:description" content="Shop fresh groceries, daily essentials, organic farm produce, dairy, and household items with instant delivery at My Grocery." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Progressive Web App (PWA) Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Grocery" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('PWA Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.error('PWA Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
